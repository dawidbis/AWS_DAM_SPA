# Pobranie sygnatur podczas budowania obrazu (CI). W Lambdzie baza jest
# tylko do odczytu; aktualizacja = przebudowa obrazu (deploy, co tydzień).
# Logi trafiają na stdout (Foreground), bez UpdateLogFile: /dev/stdout
# w kontenerze buildkit to łańcuch symlinków, którego freshclam nie otworzy.
DatabaseDirectory /var/lib/clamav
# Obraz nie ma użytkownika clamav; pliki 644 czyta też użytkownik nobody.
DatabaseOwner root
DatabaseMirror database.clamav.net
Foreground yes
NotifyClamd no
ScriptedUpdates yes
