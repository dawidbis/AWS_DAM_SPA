# clamd w środowisku Lambdy: zapisywalny jest tylko /tmp, proces nie działa
# jako root, więc bez User/PidFile i bez logów do pliku.
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
Foreground yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogSyslog no
LogTime yes

# Limity z zapasem ponad największy dopuszczalny plik (200 MB, rozdział 3.4
# przewiduje docelowo do 1 GB). Przekroczenie
# limitu zgłaszane jest jako Heuristics.Limits.Exceeded, co Lambda traktuje
# jako nieudany skan (fail closed), a nie jako plik czysty.
MaxFileSize 1100M
MaxScanSize 1100M
StreamMaxLength 1100M
AlertExceedsMax yes
MaxThreads 2
ReadTimeout 600
CommandReadTimeout 30
