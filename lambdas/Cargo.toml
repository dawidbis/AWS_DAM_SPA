[workspace]
resolver = "3"
members = ["shared", "hello-world", "api/me", "api/upload-init", "api/upload-status", "api/upload-complete", "api/assets-read", "api/asset-publish", "api/asset-rescan", "api/asset-delete", "pipeline/scan", "pipeline/start-scan", "pipeline/finalize-clean", "pipeline/handle-infected", "pipeline/validate", "pipeline/cdr", "pipeline/renditions"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
shared = { path = "shared" }
lambda_runtime = "1.4"
aws_lambda_events = { version = "1.2", default-features = false, features = ["sqs"] }
lambda_http = { version = "1.3", default-features = false, features = ["apigw_http"] }
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sfn = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
infer = { version = "0.22", default-features = false, features = ["std"] }
imagesize = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
sha2 = "0.11"
jsonschema = { version = "0.58", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"

# Thin LTO i kilka jednostek kodegeneracji: build kilkukrotnie krótszy niż
# przy pełnym LTO, binarki większe o kilka procent (bez znaczenia dla Lambd).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
