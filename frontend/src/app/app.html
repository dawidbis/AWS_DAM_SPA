<div class="navbar bg-base-100 shadow-sm">
  <div class="flex-1">
    <a class="btn btn-ghost text-xl" routerLink="/">KS Matchday · Media</a>
    <ul class="menu menu-horizontal px-1">
      @for (link of links(); track link.path) {
        <li>
          <a [routerLink]="link.path" routerLinkActive="menu-active">{{ link.label }}</a>
        </li>
      }
    </ul>
  </div>
  <div class="flex-none gap-2">
    @if (auth.isAuthenticated()) {
      <span class="hidden px-2 text-sm sm:inline">{{ auth.email() }}</span>
      <button class="btn btn-sm" type="button" (click)="auth.logout()">Wyloguj</button>
    } @else {
      <button class="btn btn-sm btn-primary" type="button" (click)="auth.login('/gallery')">
        Zaloguj
      </button>
    }
  </div>
</div>

<main class="container mx-auto p-6">
  <router-outlet />
</main>
