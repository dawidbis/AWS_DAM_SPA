name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cotygodniowe odświeżenie sygnatur ClamAV (przebudowa obrazu skanera).
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: "~1.16.0"
  TF_DIR: infra/envs/dev
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy (dev)
    needs: ci
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC do AWS (rola dam-github-deploy)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # build-scanner.sh porównuje z poprzednim commitem
      - uses: ./.github/actions/build-lambdas

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-deploy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Repozytorium ECR musi istnieć przed wypchnięciem obrazu skanera.
      - name: ECR dla skanera
        run: >-
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m
          -target=module.scanner.aws_ecr_repository.this
          -target=module.scanner.aws_ecr_lifecycle_policy.this

      - name: Obraz skanera ClamAV
        env:
          FORCE_SCANNER_BUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: ./scripts/build-scanner.sh

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy frontendu (S3 + CloudFront)
        run: ./scripts/deploy-frontend.sh

      - name: Smoke test frontendu
        run: |
          url=$(terraform -chdir="$TF_DIR" output -raw frontend_url)
          curl -fsS "$url/" | grep -q '<app-root' || { echo "::error::$url nie zwraca aplikacji"; exit 1; }
          curl -fsS "$url/config.json" | jq -e '.clientId and .authority' > /dev/null
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test hello-world
        run: |
          fn=$(terraform -chdir="$TF_DIR" output -raw hello_world_function_name)
          aws lambda invoke --function-name "$fn" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"name":"GitHub Actions"}' response.json > meta.json
          cat response.json; echo
          if jq -e '.FunctionError' meta.json > /dev/null; then
            echo "::error::Lambda zwróciła błąd"; exit 1
          fi
          jq -e '.message == "Hello, GitHub Actions!"' response.json
