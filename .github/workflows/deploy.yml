name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cotygodniowe odświeżenie sygnatur ClamAV (przebudowa obrazu skanera).
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: "~1.16.0"
  TF_DIR: infra/envs/dev
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy (dev)
    needs: ci
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC do AWS (rola dam-github-deploy)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2 # build-scanner.sh porównuje z poprzednim commitem
      # Zipy Lambd zbudowane i przetestowane w jobie CI tego samego przebiegu
      # (bez drugiego, kilkuminutowego buildu).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambdas
          path: lambdas/target/lambda

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-deploy-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Repozytorium ECR musi istnieć przed wypchnięciem obrazu skanera.
      - name: ECR dla skanera
        run: >-
          terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m
          -target=module.scanner.aws_ecr_repository.this
          -target=module.scanner.aws_ecr_lifecycle_policy.this

      - name: Czy przebudować obraz skanera
        id: scanner
        env:
          FORCE_SCANNER_BUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: ./scripts/build-scanner.sh --check

      # Toolchain Rusta tylko wtedy, gdy obraz skanera trzeba przebudować.
      - if: steps.scanner.outputs.rebuild == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - if: steps.scanner.outputs.rebuild == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lambdas
          key: scanner-x86_64
      - if: steps.scanner.outputs.rebuild == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Obraz skanera ClamAV
        if: steps.scanner.outputs.rebuild == 'true'
        env:
          FORCE_SCANNER_BUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          pip install cargo-lambda
          ./scripts/build-scanner.sh

      - name: terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Deploy frontendu (S3 + CloudFront)
        run: ./scripts/deploy-frontend.sh

      - name: Smoke test frontendu
        run: |
          url=$(terraform -chdir="$TF_DIR" output -raw frontend_url)
          curl -fsS "$url/" | grep -q '<app-root' || { echo "::error::$url nie zwraca aplikacji"; exit 1; }
          curl -fsS "$url/config.json" | jq -e '.clientId and .authority' > /dev/null
          echo "Frontend: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test hello-world
        run: |
          fn=$(terraform -chdir="$TF_DIR" output -raw hello_world_function_name)
          aws lambda invoke --function-name "$fn" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"name":"GitHub Actions"}' response.json > meta.json
          cat response.json; echo
          if jq -e '.FunctionError' meta.json > /dev/null; then
            echo "::error::Lambda zwróciła błąd"; exit 1
          fi
          jq -e '.message == "Hello, GitHub Actions!"' response.json
