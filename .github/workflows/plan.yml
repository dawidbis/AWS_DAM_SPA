name: Terraform plan

# Bez filtra ścieżek: „terraform plan (dev)” jest wymaganym checkiem w regułach
# gałęzi main, więc musi raportować wynik w każdym PR (także samego frontendu).
# Przy okazji wykrywa rozjazd między stanem Terraform a AWS.
on:
  pull_request:

permissions:
  contents: read
  id-token: write       # OIDC do AWS (rola dam-github-plan)
  pull-requests: write  # komentarz z wynikiem planu

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "~1.16.0"
  TF_DIR: infra/envs/dev
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  plan:
    name: terraform plan (dev)
    # Wymaga zmiennych z infra/bootstrap (patrz docs/setup-aws.md). Pull requesty
    # z forków nie dostają tokenu OIDC, więc je pomijamy.
    if: vars.AWS_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-lambdas

      # Wypisuje claimy tokenu OIDC (bez podpisu). Pomaga, gdy trust policy
      # roli odrzuca token (warunek na `sub` musi zgadzać się co do znaku).
      - name: Claimy tokenu OIDC
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            for (const key of ['sub', 'aud', 'repository', 'repository_owner', 'ref', 'event_name']) {
              core.info(`${key}=${claims[key]}`);
            }

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-plan-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Plan porównuje z aktualnie wdrożonym obrazem skanera (bez budowania).
      - name: Najnowszy obraz skanera
        run: |
          repo=$(aws ecr describe-repositories --repository-names matchday-dam-dev-scanner \
            --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)
          digest=$(aws ecr describe-images --repository-name matchday-dam-dev-scanner \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageDigest' --output text 2>/dev/null || true)
          if [[ -n "$repo" && -n "$digest" && "$digest" != "None" ]]; then
            echo "TF_VAR_scanner_image_uri=$repo@$digest" >> "$GITHUB_ENV"
          else
            echo "Brak obrazu skanera w ECR: plan bez Lambdy scan."
          fi

      - name: terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir="$TF_DIR" plan -input=false -no-color -lock-timeout=2m -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = brak zmian, 2 = są zmiany, 1 = błąd
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Komentarz w PR
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@v8
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:dev -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = '…(obcięto początek, pełny log w Actions)\n' + plan.slice(-max);
            }
            const status = { '0': '✅ brak zmian', '2': '📝 są zmiany', '1': '❌ błąd' }[process.env.EXIT_CODE] ?? '❔';
            const body = [
              marker,
              `### Terraform plan · \`dev\` · ${status}`,
              '',
              '<details><summary>Pokaż plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `_Commit ${context.sha.slice(0, 7)} · [log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
